name: Update Solar Data

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'   # la 0,10,20,30,40,50 min
    - cron: '5,15,25,35,45,55 * * * *'   # la 5,15,25,35,45,55 min (backup)
  workflow_dispatch:          # pornire manuală din GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet requests selenium webdriver-manager openpyxl

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable

      - name: Verifică interval activ (7:00-21:30 ora României)
        id: check_hours
        run: |
          HOUR=$(TZ='Europe/Bucharest' date +%H)
          MIN=$(TZ='Europe/Bucharest' date +%M)
          HHMM=$((10#$HOUR * 100 + 10#$MIN))
          echo "Ora Romania: $HOUR:$MIN (HHMM=$HHMM)"
          if [ "$HHMM" -ge 700 ] && [ "$HHMM" -lt 2130 ]; then
            echo "activ=true" >> $GITHUB_OUTPUT
          else
            echo "activ=false" >> $GITHUB_OUTPUT
            echo "Interval inactiv (noaptea), se sare actualizarea."
          fi

      - name: Run solar update
        if: steps.check_hours.outputs.activ == 'true'
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASS: ${{ secrets.FUSIONSOLAR_PASS }}
        run: python solar_actions.py

      - name: Commit and push JSON
        if: steps.check_hours.outputs.activ == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add fusionsolar_data.json
          git diff --staged --quiet || git commit -m "auto: solar update $(TZ='Europe/Bucharest' date '+%Y-%m-%d %H:%M') RO"
          git push
